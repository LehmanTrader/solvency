name: Deploy

# Cloudflare cannot convert a direct-upload Pages project to a Git-connected
# one, and both custom domains are attached to the existing project. So the
# build runs here and publishes to that project, rather than moving domains.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require current main as the production source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must use the main branch."
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not provide an exact commit SHA."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify checked-out production commit
        shell: bash
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the workflow commit."
            exit 1
          fi
          if [[ "$PUBLIC_CLERK_PUBLISHABLE_KEY" != pk_live_* ]]; then
            echo "Production requires a Clerk live publishable key."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Verify immutable migration checksums
        working-directory: site
        run: npm run check:migrations

      - name: Verify source-controlled rollout state
        working-directory: site
        run: npm run verify:rollout-state

      # Guards the published figures: the report tests re-derive every table
      # from the datasets, so a bad price edit fails here rather than shipping.
      # Some root tests import site server modules, so install their dependencies
      # before starting the root test graph.
      - name: Verify datasets and published figures
        run: npm test

      - name: Verify source coverage and staleness
        run: npm run coverage

      - name: Audit site and deployment dependencies
        working-directory: site
        run: npm audit --audit-level=high

      # Production remains deliberately dark until the separate paid-launch
      # checklist is approved. Do not make this a mutable repository variable:
      # a dashboard edit must not expose account workflow UI accidentally.
      - name: Build site
        working-directory: site
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_ACCOUNT_PLANS_ENABLED: 'true'
          PUBLIC_PRODUCT_INTENTS_ENABLED: 'true'
          PUBLIC_DEPLOYMENT_ENV: 'production'
          PUBLIC_STRIPE_SANDBOX_UI_ENABLED: 'false'
          PUBLIC_STRIPE_CHECKOUT_ENABLED: 'true'
          PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Prove Preview billing code is absent from the production artifact
        working-directory: site
        run: npm run verify:production-artifact-dark

      - name: Verify Pages Functions bundle
        working-directory: site
        run: npm run build:functions

      - name: Require a clean generated source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          dirty="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty"
            echo "Build or Functions compilation changed the checked-out source tree."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: npm
          wranglerVersion: '4.125.0'
          command: >-
            pages deploy dist
            --project-name solvency
            --branch main
            --commit-hash ${{ github.sha }}
            --commit-dirty=false

      - name: Attest production SHA and dark-mode health
        working-directory: site
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: npm run verify:production-dark
